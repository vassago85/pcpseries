# PCP Series — production (Nginx Proxy Manager on 41.72.157.26)
#
#   cd /opt/pcpseries
#   git pull origin main
#   docker compose -f docker-compose.prod.yml build --no-cache app
#   docker compose -f docker-compose.prod.yml up -d --force-recreate app
#
# NPM: pcp.charsleydigital.co.za -> pcpseries-app:80 (SSL)

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pcpseries-app:latest
    container_name: pcpseries-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Johannesburg
      TZ: Africa/Johannesburg
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - pcpseries-sqlite:/var/www/html/database
      - pcpseries-logs:/var/www/html/storage/logs
    networks:
      - pcpseries-internal
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/charge"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  pcpseries-internal:
    driver: bridge
  nginx-proxy-manager_default:
    external: true

volumes:
  pcpseries-sqlite:
    driver: local
  pcpseries-logs:
    driver: local
